<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!--
    BuyCart paper grain.
    fractalNoise = soft paper fibre; stitchTiles keeps the 180px tile seamless.
    The colour matrix turns the noise into cool-ink speckle at ~10% max alpha
    (row 4 controls grain strength: lower = subtler).
  -->
  <filter id="paper">
    <feTurbulence type="fractalNoise" baseFrequency="0.75 0.65" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.062 0 0 0 0 0.07 0 0 0 0 0.09 0 0 0 0.1 0"/>
  </filter>
  <rect width="180" height="180" filter="url(#paper)"/>
</svg>
